    <!-- Critical CSS inline — CSS variables + base reset so page isn't unstyled before /index.css arrives -->
    <style>
      :root{--cream:#FAF6F0;--green:#4A7C59;--gold:#C9A24A;--charcoal:#2C2C2C;--charcoal-deep:#0D0D0D;--ink:#111111;--warm-gray:#6E6860;--cream-rgb:250 246 240;--gold-rgb:201 162 74;--charcoal-rgb:44 44 44;--charcoal-deep-rgb:13 13 13;--green-rgb:74 124 89;--bg:#f8f7f4;--txt:#1f2937}

      html{overflow-x:clip;max-width:100%;scroll-behavior:smooth}
      body{margin:0;background:var(--bg);color:var(--txt);font-family:'Afacad Flux',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
      #root{overflow-x:clip;max-width:100%;min-width:0}
      .font-serif{font-family:'Cormorant Garamond',Georgia,serif}
      @keyframes pageFadeIn{from{opacity:0}to{opacity:1}}
    </style>

    <!-- Main CSS — non-render-blocking via preload trick -->
    <link rel="preload" as="style" href="/index.css" onload="this.onload=null;this.rel='stylesheet'">

    <!-- Body fonts — async, non-blocking -->
